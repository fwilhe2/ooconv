name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # Everything that needs no oracle: unit tests, loop R, loop H, the CLI. These never skip.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked
      - run: cargo test --locked -p ooconv --lib
      - run: cargo test --locked -p ooconv --test roundtrip
      - run: cargo test --locked --release -p ooconv --test hostile
      - run: cargo test --locked -p ooconv-cli

  # The validators and LibreOffice, pinned. gridcraft-cli and wordcraft-cli are not installed
  # here, so loops G and W run locally only (doc/oracles.md).
  oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: scripts/fetch-tools.sh
      - run: docker pull -q "$(cat ci/libreoffice-image)" && echo "$PWD/scripts/soffice-docker" >> "$GITHUB_PATH"
      - run: cargo test --locked -p ooconv --test schema --test libreoffice
        env:
          OOCONV_REQUIRE_ORACLES: jing,ooxml-validate,soffice
