[package]
name = "ooconv-cli"
version = "0.1.0"
description = "The ooconv command: xlsx <-> ods, docx <-> odt"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ooconv"
path = "src/main.rs"
# The library is `ooconv` too; documenting both would collide (cargo#6313).
doc = false

[dependencies]
ooconv = { path = "../ooconv" }
